name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m PyInstaller --clean --noconfirm PourNotify.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PourNotify-${{ matrix.os }}
          path: dist/
