[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pournotify"
version = "1.0.4"
description = "Local-first desktop notifications for Codex"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.0", "pyinstaller>=6"]

[project.scripts]
pournotify = "pournotify.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["pournotify*"]
